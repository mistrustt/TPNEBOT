# Docker Compose for TPNEBOT
# - `app`        runs the Discord bot
# - `db`         runs PostgreSQL 17 with a named volume for persistence
# - `db-backup`  runs `pg_dump` on a schedule (default: every 14 days) into
#                the `dbbackups` volume, keeping the newest few dumps
#
# All secrets (TOKEN, DB_PW, API keys, encryption keys) are fetched from
# Infisical at runtime. .env must only contain non-sensitive configuration
# and the Infisical machine-identity credentials.
#
# Usage:
#   1. Copy .env.example to .env and fill in the Infisical credentials.
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose logs -f app
#   5. docker compose logs -f db-backup   # confirm backups are running
#
# Restore a backup:
#   docker compose run --rm --entrypoint sh db-backup -c 'ls /backups'
#   docker compose run --rm --entrypoint sh db-backup \
#     -c 'pg_restore --clean --if-exists -d "$PGDATABASE" /backups/<file>.dump'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Postgres only listens inside the compose network by default; no host port published.

  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # pg_dump/pg_restore read these connection vars automatically.
      PGHOST: db
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_DAYS: ${BACKUP_INTERVAL_DAYS:-14}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-6}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - dbbackups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Stays on the image's default (root) user, same as `db` above - it
    # only talks to Postgres and its own `dbbackups` volume, and needs to
    # own that volume's contents the first time it's created.

  app:
    image: git.silverside-grouse.ts.net/dirtymonkeysquad/tpnebot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Non-sensitive database connection details. The password (DB_PW) is
      # fetched from Infisical at runtime and must NOT be in .env.
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      # Infisical machine-identity credentials. All secrets are fetched from
      # Infisical at startup; Infisical is mandatory.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID must be set}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET must be set}
      INFISICAL_SITE_URL: ${INFISICAL_SITE_URL:-https://us.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID must be set}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
    depends_on:
      db:
        condition: service_healthy
    # No host ports are exposed; the bot connects outbound to Discord only.
    volumes:
      - appdata:/app/data
    # Run as the unprivileged `tpnebot` user defined in the Dockerfile
    user: "1000:1000"
volumes:
  pgdata:
    name: tpnebot_pgdata
  appdata:
    name: tpnebot_appdata
  dbbackups:
    name: tpnebot_dbbackups
