# Docker Compose for TPNEBOT
# - `app` runs the Discord bot (and the in-process admin API on :8080)
# - `db`  runs PostgreSQL 17 with a named volume for persistence
#
# Usage:
#   1. Copy .env.example to .env and fill in TOKEN, DB_PW, etc.
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose logs -f app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Postgres only listens inside the compose network by default; no host port published.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tpnebot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the hardcoded localhost in bot.py so it can reach the `db` service.
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PW: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      ADMIN_API_PORT: ${ADMIN_API_PORT:-8080}
      # Allow the in-container admin API to bind 0.0.0.0 (still behind your network).
      # utils/admin_api.py also accepts the older ADMIN_API_ALLOW_EXTERNAL_BIND alias.
      ADMIN_API_BIND_EXTERNAL: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Expose the admin API (aiohttp) on the host. Drop or change if you don't need it.
      - "${ADMIN_API_PORT:-8080}:${ADMIN_API_PORT:-8080}"
    volumes:
      # Persist discord.log + any runtime artifacts outside the container.
      # Mounted on /app (not /app/data) so the RotatingFileHandler in bot.py,
      # which writes to ./discord.log at CWD, also survives `compose down`.
      - appdata:/app
    # Run as the unprivileged `tpnebot` user defined in the Dockerfile
    user: "1000:1000"

volumes:
  pgdata:
    name: tpnebot_pgdata
  appdata:
    name: tpnebot_appdata
