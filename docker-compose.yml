# Docker Compose for TPNEBOT
# - `app` runs the Discord bot (and the in-process admin API on :8080)
# - `db`  runs PostgreSQL 17 with a named volume for persistence
#
# All secrets (TOKEN, DB_PW, API keys, encryption keys) are fetched from
# Infisical at runtime. .env must only contain non-sensitive configuration
# and the Infisical machine-identity credentials.
#
# Usage:
#   1. Copy .env.example to .env and fill in the Infisical credentials.
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose logs -f app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Postgres only listens inside the compose network by default; no host port published.

  app:
    image: git.silverside-grouse.ts.net/dirtymonkeysquad/tpnebot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Non-sensitive database connection details. The password (DB_PW) is
      # fetched from Infisical at runtime and must NOT be in .env.
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      ADMIN_API_PORT: 8080
      # Allow the in-container admin API to bind 0.0.0.0 (still behind your network).
      # utils/admin_api.py also accepts the older ADMIN_API_ALLOW_EXTERNAL_BIND alias.
      ADMIN_API_BIND_EXTERNAL: "true"
      # Infisical machine-identity credentials. All secrets are fetched from
      # Infisical at startup; Infisical is mandatory.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID must be set}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET must be set}
      INFISICAL_SITE_URL: ${INFISICAL_SITE_URL:-https://us.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID must be set}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Expose the admin API (aiohttp) on the host. Override with ADMIN_API_PORT in .env.
      - "${ADMIN_API_PORT:-8080}:8080"
    volumes:
      - appdata:/app/data
    # Run as the unprivileged `tpnebot` user defined in the Dockerfile
    user: "1000:1000"
volumes:
  pgdata:
    name: tpnebot_pgdata
  appdata:
    name: tpnebot_appdata
